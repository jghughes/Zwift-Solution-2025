# Runs the same checks as CI (.github/workflows/python-ci.yml) before every commit.
# The hooks call the repo's .venv so tool versions always match requirements-dev.txt.
# Enable once per clone (works for commits made from Visual Studio too):
#   .venv\Scripts\pre-commit install
repos:
  - repo: local
    hooks:
      # Fails when ruff src, mypy_path, pyright extraPaths or any .pyproj SearchPath drifts from the folders that
      # contain .py files. Fix with: .venv\Scripts\python Thon.SolutionTools.Nov2026\src\check_import_roots.py --fix
      - id: import-roots
        name: import roots in sync
        entry: .venv\\Scripts\\python.exe Thon.SolutionTools.Nov2026/src/check_import_roots.py
        language: system
        files: \.(py|pyproj|toml)$
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: .venv\\Scripts\\python.exe -m ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: .venv\\Scripts\\python.exe -m ruff format
        language: system
        types: [python]
      # Whole-project run: strict mypy needs every module to resolve imports, so no per-file mode.
      - id: mypy
        name: mypy
        entry: .venv\\Scripts\\python.exe -m mypy .
        language: system
        types: [python]
        pass_filenames: false
      # Same analyser family and "standard" mode as Pylance in Visual Studio (Pylance bundles its own pyright version);
      # keeps editor diagnostics and mypy from drifting.
      - id: pyright
        name: pyright
        entry: .venv\\Scripts\\python.exe -m pyright
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: .venv\\Scripts\\python.exe -m pytest -q
        language: system
        types: [python]
        pass_filenames: false
