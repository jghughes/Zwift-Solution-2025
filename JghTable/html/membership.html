<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ZSUN members</title>
    <!-- AG Grid CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@29.3.4/styles/ag-grid.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@29.3.4/styles/ag-theme-alpine.css">
    <style>
        :root {
            --doc-max-width: 1200px;
            --doc-padding: 32px;
            --header-footer-space: 140px; /* used to calculate grid height */
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f8f9fa;
            margin: 0;
            padding: 0;
        }

        .document-container {
            max-width: var(--doc-max-width);
            margin: 24px auto;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            padding: var(--doc-padding);
            box-sizing: border-box;
        }

        h1 {
            margin-top: 0;
        }

        #filterInput {
            margin-bottom: 16px;
            padding: 8px 12px;
            width: 100%;
            max-width: 360px;
            font-size: 16px;
            border: 1px solid #b0b0b0;
            border-radius: 4px;
        }

        /* Make the grid fill the available vertical space on larger screens,
           but use a smaller height on phones. Allow horizontal scrolling on small screens. */
        .ag-theme-alpine {
            width: 100%;
            height: calc(100vh - var(--header-footer-space));
            min-height: 360px;
            box-sizing: border-box;
            overflow: auto; /* allow horizontal scroll on small screens */
        }

        /* Styles for focusable, copyable cells */
        .copyable-cell {
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
            cursor: text; /* indicate selectable text */
            outline: none;
        }

            .copyable-cell:focus {
                box-shadow: inset 0 0 0 2px rgba(25,118,210,0.12);
                border-radius: 2px;
            }

        #footer {
            margin-top: 24px;
            text-align: right;
            color: #888;
            font-size: 13px;
        }

        /* Responsive adjustments */
        @media (max-width: 1024px) {
            :root {
                --doc-max-width: 1000px;
                --doc-padding: 20px;
                --header-footer-space: 140px;
            }

            .document-container {
                margin: 20px;
            }

            .ag-theme-alpine {
                height: calc(100vh - var(--header-footer-space));
                min-height: 420px;
            }
        }

        @media (max-width: 768px) {
            :root {
                --doc-padding: 16px;
                --header-footer-space: 140px;
            }

            .document-container {
                margin: 12px;
                border-radius: 6px;
                padding: 16px;
            }

            #filterInput {
                max-width: 100%;
                font-size: 15px;
            }

            .ag-theme-alpine {
                height: calc(100vh - 200px);
                min-height: 320px;
                font-size: 13px;
            }
        }

        @media (max-width: 480px) {
            /* phone: keep grid usable, allow horizontal scroll if wide columns */
            :root {
                --header-footer-space: 220px;
            }

            .document-container {
                padding: 12px;
                margin: 8px;
            }

            .ag-theme-alpine {
                height: calc(100vh - var(--header-footer-space));
                min-height: 300px;
                font-size: 12px;
            }
                /* reduce padding inside grid overlays/buttons */
                .ag-theme-alpine button {
                    padding: 6px 8px;
                    font-size: 12px;
                }
        }
    </style>
</head>
<body>
    <div class="document-container">
        <h1>ZSUN Club Membership List</h1>
        <input type="text" id="filterInput" placeholder="Filter...">
        <div id="myGrid" class="ag-theme-alpine"></div>
        <div id="footer">Generated by John Hughes</div>
    </div>
    <!-- AG Grid JS -->
    <script src="https://cdn.jsdelivr.net/npm/ag-grid-community@29.3.4/dist/ag-grid-community.min.js"></script>
    <!-- Your AG Grid initialization and data loading - on the static website edit the path to delete the relative part of the address -->
    <script src="../javascript/membership_init.js"></script>
</body>
</html>
