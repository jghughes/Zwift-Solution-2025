<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AG Grid Test</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@29.3.4/styles/ag-grid.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@29.3.4/styles/ag-theme-alpine.css">
</head>
<body>
    <div id="myGrid" class="ag-theme-alpine" style="height: 200px; width: 600px;"></div>
    <script src="https://cdn.jsdelivr.net/npm/ag-grid-community@29.3.4/dist/ag-grid-community.min.js"></script>
    <script>const columnDefs = [
            { headerName: "ID", field: "id" },
            { headerName: "Name", field: "name" }
        ];
        const rowData = [
            { id: 1, name: "Test" }
        ];
        const gridOptions = {
            columnDefs: columnDefs,
            rowData: rowData
        };
        new agGrid.Grid(document.getElementById('myGrid'), gridOptions);</script>
</body>
</html>
