<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 - Page not found</title>
    <style>
        body {
            font-family: Calibri, 'Segoe UI', Arial, sans-serif;
            background: #f8f9fa;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            margin: 20px;
            background: #fff;
            border-radius: 4px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            padding: 32px;
            text-align: center;
        }

        h1 {
            margin: 0 0 12px 0;
            font-size: 48px;
            color: #222;
        }

        p {
            margin: 0 0 24px 0;
            font-size: 16px;
            color: #666;
            line-height: 1.5;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            background: #1976d2;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            font-size: 15px;
            font-weight: 500;
            transition: background 0.2s;
        }

            .btn:hover {
                background: #1565c0;
            }

        .links {
            margin-top: 24px;
            font-size: 14px;
            color: #888;
        }

            .links a {
                color: #1976d2;
                text-decoration: underline;
            }

        @media (max-width: 768px) {
            .container {
                padding: 24px;
            }

            h1 {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <p>The page you're looking for could not be found.</p>
        <a class="btn" href="./index.html">Go to Membership List</a>
        <div class="links">
            <a href="https://github.com/jghughes/Zwift-Solution-2025" target="_blank">Project Repository</a>
        </div>
    </div>
</body>
</html>
