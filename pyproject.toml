# The "src" list for ruff, "mypy_path" for mypy and "extraPaths" for pyright below are deliberately identical:
# every folder that holds importable modules (there are no __init__.py packages). Do not edit these lists by hand:
# run `python Thon.SolutionTools.Nov2026\src\check_import_roots.py --fix`, which rewrites them (and the SearchPath entries in the .pyproj files)
# from the folders that directly contain .py files. Pre-commit and CI run it in check mode.

[tool.ruff]
target-version = "py312"
line-length = 120
src = [
    "Thon.Azure.Oct2026/src",
    "Thon.Goodies.Jan2025/src",
    "Thon.SolutionTools.Nov2026/src",
    "Zsun.DataModels.Jan2024/src/my_models",
    "Zsun.DataModels.Jan2024/src/third_party_models",
    "Zsun.DataTransferObjects.Jan2024/src/my_DTO",
    "Zsun.DataTransferObjects.Jan2024/src/third_party_DTO",
    "Zsun01/src",
    "Zsun01/src/custom_file_io",
    "Zsun01/src/formulae",
    "Zsun01/src/main_little_utilities",
    "Zsun01/src/main_production_pipeline",
    "Zsun01/src/main_tools",
    "Zsun01/src/matplot",
    "Zsun01/src/paceline_display",
    "Zsun01/src/repositories",
]
# Ruff already skips .mypy_cache, .ruff_cache and .pytest_cache by default and honours .gitignore (.vs/).

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "SIM", "RUF",
    "ASYNC", "C4", "DTZ", "FURB", "ICN", "LOG", "NPY", "PD", "PERF", "PGH", "PIE", "PLE", "PLW", "PT", "PTH",
    "RSE", "S", "TID",
]
# Repo-wide deferral only for a rule with hundreds of hits. Remove it as the code is cleaned up.
ignore = [
    "E501",   # line length: `ruff format` handles code; 113 long strings/comments remain that it cannot wrap
]

[tool.ruff.lint.per-file-ignores]
# These helpers validate and split filename *strings* (blob names, user input); they never touch the filesystem.
# pathlib's suffix/stem differ from os.path.splitext on edge cases such as "a." and "CON.", which would silently
# change validation results, so os.path is kept on purpose.
"Thon.Goodies.Jan2025/src/jgh_path_helpers.py" = ["PTH119", "PTH122"]
"Thon.Goodies.Jan2025/src/jgh_mime_type_map.py" = ["PTH122"]

# known-first-party is not needed: every first-party module folder is already listed in "src" above.

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
# $MYPY_CONFIG_FILE_DIR keeps the paths valid when mypy is launched from any working directory.
mypy_path = [
    "$MYPY_CONFIG_FILE_DIR/Thon.Azure.Oct2026/src",
    "$MYPY_CONFIG_FILE_DIR/Thon.Goodies.Jan2025/src",
    "$MYPY_CONFIG_FILE_DIR/Thon.SolutionTools.Nov2026/src",
    "$MYPY_CONFIG_FILE_DIR/Zsun.DataModels.Jan2024/src/my_models",
    "$MYPY_CONFIG_FILE_DIR/Zsun.DataModels.Jan2024/src/third_party_models",
    "$MYPY_CONFIG_FILE_DIR/Zsun.DataTransferObjects.Jan2024/src/my_DTO",
    "$MYPY_CONFIG_FILE_DIR/Zsun.DataTransferObjects.Jan2024/src/third_party_DTO",
    "$MYPY_CONFIG_FILE_DIR/Zsun01/src",
    "$MYPY_CONFIG_FILE_DIR/Zsun01/src/custom_file_io",
    "$MYPY_CONFIG_FILE_DIR/Zsun01/src/formulae",
    "$MYPY_CONFIG_FILE_DIR/Zsun01/src/main_little_utilities",
    "$MYPY_CONFIG_FILE_DIR/Zsun01/src/main_production_pipeline",
    "$MYPY_CONFIG_FILE_DIR/Zsun01/src/main_tools",
    "$MYPY_CONFIG_FILE_DIR/Zsun01/src/matplot",
    "$MYPY_CONFIG_FILE_DIR/Zsun01/src/paceline_display",
    "$MYPY_CONFIG_FILE_DIR/Zsun01/src/repositories",
]
# No "exclude" needed: mypy already skips dot-directories (.vs, .mypy_cache, .ruff_cache, .pytest_cache) and __pycache__.
warn_unreachable = true
local_partial_types = true
disallow_any_unimported = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "truthy-iterable",
    "possibly-undefined",
    "unused-awaitable",
]
show_column_numbers = true
warn_unused_configs = true
sqlite_cache = true

# scipy and scikit-learn ship no type information; treat them as Any in one place
# instead of scattering "# type: ignore[import-untyped]" through the code.
[[tool.mypy.overrides]]
module = ["scipy.*", "sklearn.*"]
ignore_missing_imports = true
disallow_any_unimported = false

# Read by Pylance (bundled with Visual Studio's Python workload) for intellisense and live diagnostics.
# Pylance ignores [tool.ruff] and [tool.mypy], so the import roots are repeated here (kept identical by Thon.SolutionTools.Nov2026\src\check_import_roots.py).
# "standard" stays deliberately lighter than mypy --strict: mypy remains the gate, Pylance is for fast feedback.
[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
exclude = ["**/__pycache__", "**/.*"]
extraPaths = [
    "Thon.Azure.Oct2026/src",
    "Thon.Goodies.Jan2025/src",
    "Thon.SolutionTools.Nov2026/src",
    "Zsun.DataModels.Jan2024/src/my_models",
    "Zsun.DataModels.Jan2024/src/third_party_models",
    "Zsun.DataTransferObjects.Jan2024/src/my_DTO",
    "Zsun.DataTransferObjects.Jan2024/src/third_party_DTO",
    "Zsun01/src",
    "Zsun01/src/custom_file_io",
    "Zsun01/src/formulae",
    "Zsun01/src/main_little_utilities",
    "Zsun01/src/main_production_pipeline",
    "Zsun01/src/main_tools",
    "Zsun01/src/matplot",
    "Zsun01/src/paceline_display",
    "Zsun01/src/repositories",
]
